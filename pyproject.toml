[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordflow"
version = "0.1.0"
description = "Quiet, offline English typing and spelling practice in your terminal."
license = {file = "LICENSE"}
keywords = ["english", "typing-practice", "spelling", "terminal", "tui", "language-learning"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "textual>=0.58.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/KaiXinChaoRen1/wordflow"
Repository = "https://github.com/KaiXinChaoRen1/wordflow"
Issues = "https://github.com/KaiXinChaoRen1/wordflow/issues"

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
wordflow = "wordflow.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
